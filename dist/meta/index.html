<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="실제 대한민국 지도와 실제 바다 날씨(파고·바람)로 즐기는 낚시 게임">
<meta property="og:type" content="website">
<meta property="og:site_name" content="방구석 낚시꾼">
<meta property="og:title" content="방구석 낚시꾼 - 진짜 바다 날씨로 즐기는 방구석 낚시">
<meta property="og:description" content="실제 대한민국 지도·실제 파고와 바람으로 즐기는 낚시 게임. 낚시GO 아이디로 바로 시작">
<meta property="og:image" content="https://www.fishing-go.com/meta/og-banggusuk.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="방구석 낚시꾼 앱 아이콘과 이름">
<meta property="og:url" content="https://www.fishing-go.com/meta/">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.fishing-go.com/meta/og-banggusuk.png">
<link rel="icon" type="image/png" sizes="32x32" href="/meta/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/meta/icon-192.png">
<link rel="apple-touch-icon" href="/meta/apple-touch-icon.png">
<title>방구석 낚시꾼</title>
<script>
  // /meta/ 주소의 링크 미리보기(og)용 페이지 — 사람은 404.html과 같은 방식으로 낚시GO 앱의 /meta(로그인 → 게임)로 보낸다
  // V165 친구 초대 링크(?inv=코드): 코드를 이 도메인 localStorage에 남겨 두면 로그인·가입 뒤 게임이 자동으로 입력한다 · 방문 수만 센다
  try { var iv = new URLSearchParams(location.search).get('inv'); if (iv && /^[A-Za-z0-9]{4,12}$/.test(iv)) { localStorage.setItem('fishinggo.meta.inv', JSON.stringify({ c: iv.toUpperCase(), t: Date.now() }));
    try { fetch('https://fishinggo-meta.fishinggo.workers.dev/api/meta/inv-hit?c=' + encodeURIComponent(iv), { mode: 'no-cors', keepalive: true }); } catch (e) {} } } catch (e) {}
  try { sessionStorage.redirect = 'https://www.fishing-go.com/meta' + location.search + location.hash; } catch (e) {}
  location.replace('https://www.fishing-go.com/');
</script>
</head>
<body><noscript><a href="https://www.fishing-go.com/">낚시GO에서 방구석 낚시꾼 시작하기</a></noscript></body>
</html>
